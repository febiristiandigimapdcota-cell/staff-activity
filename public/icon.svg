<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Apple Dark Titanium & Deep Obsidian Gradient -->
    <linearGradient id="appleTitanium" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#242426" />
      <stop offset="40%" stop-color="#18181a" />
      <stop offset="100%" stop-color="#0c0c0e" />
    </linearGradient>

    <!-- Razor-thin Metallic Bevel Specular Rim -->
    <linearGradient id="metallicBevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="30%" stop-color="#8e8e93" stop-opacity="0.2" />
      <stop offset="70%" stop-color="#1c1c1e" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.2" />
    </linearGradient>

    <!-- Apple VisionOS Glass Gloss -->
    <linearGradient id="visionGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Subtle Activity Accent Glow behind head -->
    <radialGradient id="activityAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a84ff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0a84ff" stop-opacity="0" />
    </radialGradient>

    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Apple Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#appleTitanium)" filter="url(#subtleShadow)" />
  <rect x="24" y="24" width="464" height="232" rx="108" fill="url(#visionGloss)" />
  <rect x="24.5" y="24.5" width="463" height="463" rx="107.5" fill="none" stroke="url(#metallicBevel)" stroke-width="2.5" />

  <!-- Subtle Aura in center for Apple aesthetic -->
  <circle cx="256" cy="270" r="140" fill="url(#activityAura)" />

  <!-- Human Figure Vector Silhouette (Negative Space Cutout in Pure Solid White) -->
  <g fill="#ffffff">
    <!-- Head Circle -->
    <circle cx="256" cy="150" r="38" />

    <!-- Torso and Shoulders -->
    <path d="M 216 206 C 200 206 186 218 184 234 L 184 316 C 184 322 189 326 195 326 C 201 326 206 322 206 316 L 206 254 C 206 250 210 246 214 246 C 218 246 222 250 222 254 L 222 414 C 222 422 228 428 236 428 L 244 428 C 251 428 254 423 254 416 L 254 320 C 254 316 258 316 258 320 L 258 416 C 258 423 261 428 268 428 L 276 428 C 284 428 290 422 290 414 L 290 254 C 290 250 294 246 298 246 C 302 246 306 250 306 254 L 306 316 C 306 322 311 326 317 326 C 323 326 328 322 328 316 L 328 234 C 326 218 312 206 296 206 Z" />
  </g>
</svg>
